# Docker's DNS returns every replica; re-resolve so scaled replicas join automatically.
resolver 127.0.0.11 valid=10s ipv6=off;

# Cluster A and cluster B share traffic; if one cluster is down, the other serves everything.
upstream ssimaya_app {
  zone ssimaya_app 128k;
  least_conn;
  server app_a:3000 resolve max_fails=3 fail_timeout=10s;
  server app_b:3000 resolve max_fails=3 fail_timeout=10s;
  keepalive 128;
}

# Cache for hashed build assets and optimized images.
proxy_cache_path /var/cache/nginx/ssimaya levels=1:2 keys_zone=ssimaya_static:20m max_size=1g inactive=7d use_temp_path=off;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      '';
}

server {
  listen 80;
  server_tokens off;
  client_max_body_size 20m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_next_upstream error timeout http_502 http_503 http_504;
  proxy_next_upstream_tries 2;

  # Hashed build files never change, so nginx serves them without touching the app.
  location /_next/static/ {
    proxy_pass http://ssimaya_app;
    proxy_set_header Connection "";
    proxy_cache ssimaya_static;
    proxy_cache_valid 200 30d;
    proxy_ignore_headers Set-Cookie;
    add_header X-Cache $upstream_cache_status;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /_next/image {
    proxy_pass http://ssimaya_app;
    proxy_set_header Connection "";
    proxy_cache ssimaya_static;
    proxy_cache_valid 200 7d;
    proxy_cache_key $scheme$host$request_uri;
    add_header X-Cache $upstream_cache_status;
  }

  # Socket.IO: clients are websocket-only, so no sticky sessions are needed.
  location /socket.io/ {
    proxy_pass http://ssimaya_app;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
  }

  location = /lb-health {
    access_log off;
    return 200 "ok\n";
  }

  location / {
    proxy_pass http://ssimaya_app;
    proxy_set_header Connection "";
  }
}
