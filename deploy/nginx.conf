# Docker's DNS returns every app replica; re-resolve so scaled replicas join.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream ssimaya_app {
  zone ssimaya_app 64k;
  least_conn;
  server app:3000 resolve max_fails=3 fail_timeout=10s;
  keepalive 64;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      '';
}

server {
  listen 80;
  client_max_body_size 20m;

  location / {
    proxy_pass http://ssimaya_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Socket.IO (websocket-only clients, so no sticky sessions are needed).
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
    proxy_next_upstream error timeout http_502 http_503;
  }
}
