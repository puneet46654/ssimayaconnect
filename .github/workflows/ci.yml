name: CI

on:
  push:
    branches: [main, testing]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # Placeholder values so the build can load modules; no real services are contacted.
          MONGODB_URI: mongodb://localhost:27017/ci-placeholder
          ADMIN_SESSION_SECRET: ci-placeholder-secret
          BOOKING_ACCESS_SECRET: ci-placeholder-secret
