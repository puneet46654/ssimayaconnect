name: Revert / Restore main

# Manual rollback. Run from GitHub -> Actions -> "Revert / Restore main".
# Adds revert commits (history is kept, no force push).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "last-commit = revert latest commit on main; restore-branch = make main match a branch"
        type: choice
        options: [last-commit, restore-branch]
        default: last-commit
      branch:
        description: "Branch to restore from (restore-branch mode only)"
        default: "backup(5th-october-before-merge)"

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Revert last commit
        if: inputs.mode == 'last-commit'
        run: |
          if [ "$(git rev-list --parents -n1 HEAD | wc -w)" -gt 2 ]; then
            git revert --no-edit -m 1 HEAD
          else
            git revert --no-edit HEAD
          fi
      - name: Restore from branch
        if: inputs.mode == 'restore-branch'
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          git checkout "origin/$BRANCH" -- .
          git diff --cached --quiet || git commit -m "Restore main to state of $BRANCH"
      - name: Push
        run: git push origin main
