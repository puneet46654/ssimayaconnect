# Self-hosted production stack:
#   nginx (load balancer) -> cluster A + cluster B (app containers, CLUSTER_WORKERS each)
#   redis                 -> shares realtime pushes between every app process
#   backup-sync           -> mirrors the primary MongoDB into the backup cluster
# Run: docker compose up -d --build
x-app: &app
  build: .
  env_file: .env.local
  environment:
    NODE_ENV: production
    HOSTNAME: 0.0.0.0
    PORT: 3000
    CLUSTER_WORKERS: ${CLUSTER_WORKERS:-2}
    REDIS_URL: redis://redis:6379
  depends_on:
    - redis
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
    interval: 15s
    timeout: 3s
    retries: 3
    start_period: 20s
  restart: unless-stopped

services:
  app_a:
    <<: *app
    deploy:
      replicas: ${CLUSTER_A_REPLICAS:-2}

  app_b:
    <<: *app
    deploy:
      replicas: ${CLUSTER_B_REPLICAS:-2}

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

  backup-sync:
    build: .
    command: ["node", "scripts/backup-sync.mjs"]
    env_file: .env.local
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${LB_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app_a
      - app_b
    restart: unless-stopped
